*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg-outer,#ffe9c7);font-family:'Nunito',system-ui,sans-serif;color:#3d2c1e;overscroll-behavior:none}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;border-radius:0;background:var(--bg)}
img{object-fit:contain;-webkit-user-drag:none;user-drag:none;pointer-events:none;display:block}
button{font-family:'Fredoka',sans-serif;cursor:pointer;border:none;color:inherit}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

/* top bar */
.topbar{position:absolute;left:0;right:0;top:0;height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;z-index:5}
.homebtn{width:70px;height:70px;border-radius:50%;background:#fff;font-size:36px;box-shadow:0 5px 0 rgba(61,44,30,.25);border:4px solid #3d2c1e;display:flex;align-items:center;justify-content:center;line-height:1}
.homebtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(61,44,30,.25)}
.title{font-family:'Fredoka';font-weight:700;font-size:40px;background:#fff;border:4px solid #3d2c1e;border-radius:40px;padding:4px 34px;box-shadow:0 5px 0 rgba(61,44,30,.2)}
.stars{display:flex;gap:4px;background:#fff;border:4px solid #3d2c1e;border-radius:40px;padding:4px 16px;min-width:70px;justify-content:center;box-shadow:0 5px 0 rgba(61,44,30,.2)}
.star{font-size:36px;color:#e3dccf;line-height:1.1;transition:transform .3s}
.star.on{color:#ffc61a;text-shadow:0 2px 0 #d39a00;animation:starPop .5s}
@keyframes starPop{0%{transform:scale(.3)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
.spacer{width:70px}

/* buttons */
.btn{font-weight:600;font-size:34px;padding:12px 34px;border-radius:22px;border:4px solid #3d2c1e;box-shadow:0 6px 0 rgba(61,44,30,.3);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(61,44,30,.3)}
.btn.green{background:#3fbf73}.btn.blue{background:#4a9cf0}.btn.pink{background:#ff6b8f}.btn.orange{background:#ff9a3c}.btn.purple{background:#8b6cf0}
.btn.small{font-size:26px;padding:8px 22px}

/* object cards */
.card{position:absolute;background:#fff;border:5px solid #3d2c1e;border-radius:28px;box-shadow:0 7px 0 rgba(61,44,30,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s,opacity .3s}
.card img{width:78%;height:auto;max-height:78%}
.card .lbl{font-family:'Fredoka';font-weight:600;font-size:34px;line-height:1;margin-top:2px}
.card.sel{box-shadow:0 0 0 8px #ffd23f,0 7px 0 rgba(61,44,30,.22);transform:scale(1.05)}
.card.dragging{opacity:.25}
.card.locked{pointer-events:none}
.ghost{position:fixed;z-index:9999;pointer-events:none;background:#fff;border:5px solid #3d2c1e;border-radius:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 30px rgba(0,0,0,.25)}
.ghost img{width:82%;height:82%;object-fit:contain}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{translate:0}20%{translate:-14px}40%{translate:12px}60%{translate:-9px}80%{translate:6px}}
.bounce{animation:bounce .6s}
@keyframes bounce{0%,100%{transform:scale(1)}30%{transform:scale(1.15) rotate(-3deg)}60%{transform:scale(.95) rotate(2deg)}}
.wiggle{animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-6px)}}

/* home */
.home-title{position:absolute;left:0;right:0;top:44px;text-align:center}
.home-title h1{margin:0;font-family:'Fredoka';font-weight:700;font-size:88px;line-height:1;color:#fff;-webkit-text-stroke:5px #3d2c1e;paint-order:stroke fill;text-shadow:0 7px 0 #3d2c1e}
.home-title .sub{display:inline-block;margin-top:14px;font-family:'Fredoka';font-weight:600;font-size:30px;background:#fff;border:4px solid #3d2c1e;border-radius:30px;padding:4px 26px}
.brand{position:absolute;left:24px;top:18px;font-family:'Fredoka';font-weight:600;font-size:20px;background:rgba(255,255,255,.85);border-radius:20px;padding:4px 14px;border:3px solid #3d2c1e}
.parade{position:absolute;left:0;right:0;top:236px;display:flex;justify-content:center;gap:26px}
.parade img{width:118px;height:118px}
.parade div{animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.modes{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;gap:26px}
.mode{width:268px;height:250px;border-radius:32px;border:5px solid #3d2c1e;box-shadow:0 9px 0 rgba(61,44,30,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.mode:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(61,44,30,.3)}
.mode .ic{width:120px;height:120px;background:#fff;border-radius:50%;border:4px solid #3d2c1e;display:flex;align-items:center;justify-content:center;font-size:62px;text-shadow:none}
.mode .ic img{width:92px;height:92px}
.mode b{font-family:'Fredoka';font-weight:600;font-size:34px;line-height:1.05}
.mode small{font-size:20px;font-weight:800;opacity:.95}

/* speech bubble */
.bubble{position:absolute;background:#fff;border:5px solid #3d2c1e;border-radius:34px;padding:14px 26px;font-family:'Fredoka';font-weight:600;font-size:44px;display:flex;align-items:center;gap:16px;box-shadow:0 7px 0 rgba(61,44,30,.2)}
.bubble .word{color:#e2456a}
.spk{width:66px;height:66px;flex:none;border-radius:50%;background:#ffd23f;border:4px solid #3d2c1e;font-size:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(61,44,30,.25)}
.spk:active{transform:translateY(3px)}
.hint{position:absolute;left:0;right:0;text-align:center;font-family:'Fredoka';font-weight:500;font-size:26px;opacity:.85}

/* overlay */
#overlay{position:absolute;inset:0;background:rgba(40,25,10,.45);display:none;align-items:center;justify-content:center;z-index:50}
#overlay.on{display:flex}
.win-card{background:#fff;border:6px solid #3d2c1e;border-radius:40px;padding:30px 60px 40px;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.25);animation:pop .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.win-card h2{font-family:'Fredoka';font-size:66px;margin:6px 0 0}
.win-card p{font-size:28px;font-weight:700;margin:6px 0 26px}
.win-stars span{font-size:90px;color:#ffc61a;text-shadow:0 4px 0 #d39a00;display:inline-block;animation:starPop .6s backwards}
.win-stars span:nth-child(2){font-size:120px;animation-delay:.15s}.win-stars span:nth-child(3){animation-delay:.3s}
.win-btns{display:flex;gap:22px;justify-content:center}
.confetti{position:absolute;top:-20px;width:14px;height:22px;border-radius:3px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),780px) rotate(var(--r))}}
.sparkle{position:absolute;pointer-events:none;font-size:44px;animation:spark 1s ease-out forwards;z-index:30}
@keyframes spark{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.6) translateY(-40px);opacity:0}}
.hubbtn{position:absolute;right:24px;z-index:6;display:none;font-family:'Fredoka';font-weight:600;font-size:24px;background:#fff;border:4px solid #3d2c1e;border-radius:30px;padding:6px 20px;box-shadow:0 5px 0 rgba(61,44,30,.25)}
.hubbtn:active{transform:translateY(3px)}
body.inhub .hubbtn{display:block}

:root{--bg-outer:#e6eefc;--bg:linear-gradient(90deg,#fff3d6 0 50%,#e3f2ff 50% 100%)}
#stage::after{content:"";position:absolute;left:0;right:0;top:64%;bottom:0;background:linear-gradient(90deg,#e9b77c 0 50%,#f1d29c 50% 100%);border-top:10px solid #c98a52;pointer-events:none;z-index:0}
.screen{z-index:1}
.gcard{position:absolute;top:250px;width:520px;height:410px;border-radius:40px;border:6px solid #3d2c1e;box-shadow:0 10px 0 rgba(61,44,30,.3);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:22px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.gcard:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(61,44,30,.3)}
.gcard.a{left:80px;background:#ff9a3c}.gcard.b{right:80px;background:#8b6cf0}
.gcard .pics{width:440px;height:200px;background:#fff;border:5px solid #3d2c1e;border-radius:30px;display:flex;align-items:center;justify-content:center;gap:6px}
.gcard .pics img{width:130px;height:130px}
.gcard b{font-family:'Fredoka';font-weight:700;font-size:54px;line-height:1;margin-top:22px}
.gcard small{font-family:'Fredoka';font-weight:600;font-size:28px;margin-top:8px;opacity:.95}
.gcard .play{margin-top:16px;font-family:'Fredoka';font-weight:600;font-size:26px;background:#fff;color:#3d2c1e;text-shadow:none;border:4px solid #3d2c1e;border-radius:26px;padding:4px 30px}
#gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;z-index:100;background:#fff}
</style>
</head>

</div>

const wait = (ms) => new Promise(r => setTimeout(r, ms));

// ---- stage fits any landscape/portrait screen ----
function fitStage() {
  const st = $('#stage');
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  st.style.transform = `translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', () => setTimeout(fitStage, 200));

// ---- voice (Web Speech) ----
let VOICE = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  const pref = ['Samantha', 'Karen', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Moira', 'Tessa', 'Serena', 'Daniel'];
  for (const n of pref) { const v = vs.find(v => v.name.includes(n) && /^en/i.test(v.lang)); if (v) { VOICE = v; return; } }
  VOICE = vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let sayToken = 0;
function say(text, rate = 0.85) {
  if (!('speechSynthesis' in window)) return wait(400);
  const my = ++sayToken;
  speechSynthesis.cancel();
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    if (VOICE) { u.voice = VOICE; u.lang = VOICE.lang; } else u.lang = 'en-US';
    u.rate = rate; u.pitch = 1.1;
    let done = false; const fin = () => { if (!done) { done = true; res(my === sayToken); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 1200 + text.length * 110);
    speechSynthesis.speak(u);
  });
}

// ---- sound effects (WebAudio, no files) ----
let AC = null;
function audio() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === 'suspended') AC.resume();

}
function tone(f, dur, type = 'sine', vol = 0.18, when = 0, slideTo = null) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}

  good() { [523, 659, 784].forEach((f, i) => tone(f, 0.28, 'triangle', 0.2, i * 0.09)); },
  bad() { tone(260, 0.22, 'sine', 0.16, 0, 170); },
  pop() { tone(700, 0.1, 'sine', 0.16, 0, 1100); },

let unlocked = false;
function unlock() {

// ---- drag (or tap) helper ----
function inRect(x, y, el, pad = 0) {
  const r = el.getBoundingClientRect();
  return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
}
function draggable(el, { src, onDrop, onTap, onMove }) {
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', (e) => {
    if (el.classList.contains('locked') || document.body.classList.contains('busy')) return;
    e.preventDefault();
    const r = el.getBoundingClientRect(), sx = e.clientX, sy = e.clientY, id = e.pointerId;
    let ghost = null, moved = false;
    const move = (ev) => {
      if (ev.pointerId !== id) return;
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) > 10) {
        moved = true;
        ghost = document.createElement('div'); ghost.className = 'ghost';
        ghost.innerHTML = `<img src="${src}" alt="">`;
        Object.assign(ghost.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
        document.body.appendChild(ghost); el.classList.add('dragging'); SFX.pop();
      }
      if (moved) { ghost.style.transform = `translate(${dx}px,${dy}px) scale(1.1) rotate(-4deg)`; onMove && onMove(ev.clientX, ev.clientY); }
    };
    const up = (ev) => {
      if (ev.pointerId !== id) return;
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      if (!moved) { el.classList.remove('dragging'); onTap && onTap(); return; }
      const ok = ev.type !== 'pointercancel' && onDrop(ev.clientX, ev.clientY, ghost);
      if (ok === 'keep') return; // caller animates + removes ghost
      if (ok) { ghost.remove(); el.classList.remove('dragging'); return; }
      ghost.style.transition = 'transform .35s cubic-bezier(.3,1.4,.6,1)';
      ghost.style.transform = 'translate(0,0) scale(1)';
      setTimeout(() => { ghost.remove(); el.classList.remove('dragging'); }, 360);
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
}

// ---- confetti ----
function confetti(n = 60) {
  const st = $('#stage'), colors = ['#ff5e7e', '#ffd23f', '#44c47c', '#5fb8ff', '#9a82ff', '#ff9a3c'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random() * 1280 + 'px';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    c.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    c.style.setProperty('--x', (Math.random() * 200 - 100) + 'px');
    st.appendChild(c); setTimeout(() => c.remove(), 4200);
  }
}

};
document.addEventListener('DOMContentLoaded', () => {
  $$('.homebtn').forEach(b => { b.innerHTML = ICON.home; b.onclick = () => show('home'); });
  $$('.spk').forEach(b => { b.innerHTML = ICON.speaker; });
});
function sparkle(x, y) {
  const st = $('#stage');
  ['✦', '✧', '✦'].forEach((t, i) => {
    const s = document.createElement('div'); s.className = 'sparkle'; s.textContent = t;
    s.style.left = (x - 20 + (i - 1) * 50) + 'px'; s.style.top = (y - 30 + (i % 2) * 30) + 'px';
    s.style.color = ['#ffc61a', '#ff6b8f', '#4a9cf0'][i]; s.style.animationDelay = i * 0.1 + 's';
    st.appendChild(s); setTimeout(() => s.remove(), 1300);
  });
}

// ---- screens ----
function show(id) {
  speechSynthesis && speechSynthesis.cancel && speechSynthesis.cancel();
  $$('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  $('#overlay').classList.remove('on');
  $$('.confetti').forEach(c => c.remove());
  document.body.classList.remove('busy');
}
function stars(el, total, filled) {
  el.innerHTML = Array.from({ length: total }, (_, i) => `<span class="star ${i < filled ? 'on' : ''}">★</span>`).join('');
}
function celebrate(title, sub, again) {
  SFX.win(); confetti(80);
  const ov = $('#overlay');
  ov.innerHTML = `<div class="win-card">
    <div class="win-stars"><span>★</span><span>★</span><span>★</span></div>
    <h2>${title}</h2><p>${sub}</p>
    <div class="win-btns"><button class="btn green" id="again">Play again</button><button class="btn blue" id="gohome">Home</button></div></div>`;
  ov.classList.add('on');
  $('#again').onclick = () => { ov.classList.remove('on'); $$('.confetti').forEach(c => c.remove()); again(); };
  $('#gohome').onclick = () => show('home');
  setTimeout(() => say(title.replace(/[!★]/g, '') + '!'), 500);
}

// ---- inside the all-games hub? ----
if (window.parent !== window) { document.body.classList.add('inhub'); }
function toHub() { try { speechSynthesis.cancel(); } catch (e) {} window.parent.postMessage('esl-hub', '*'); }

const pic = k => `<img src="data:image/webp;base64,${PHOTOS[k]}" alt="${k}">`;
$('#picsA').innerHTML = ['table', 'bed', 'fridge'].map(pic).join('');
$('#picsB').innerHTML = ['pencil', 'book', 'bag'].map(pic).join('');
const decode = b => new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)));
const cache = {};
function openGame(g) {
  SFX.pop();
  const f = $('#gameFrame');
  f.srcdoc = cache[g] || (cache[g] = decode(GAMES[g]));
  f.style.display = 'block';
}
function closeGame() {
  const f = $('#gameFrame');
  f.style.display = 'none'; f.srcdoc = '<!DOCTYPE html><html><body></body></html>';
  try { speechSynthesis.cancel(); } catch (e) {}
}
$$('.gcard').forEach(c => c.onclick = () => openGame(c.dataset.g));
window.addEventListener('message', e => { if (e.data === 'esl-hub') closeGame(); });
fitStage();
</script>
</body>
</html>
